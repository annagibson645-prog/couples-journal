name: Firestore rules tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dev dependencies (CI only)
        run: npm install --no-audit --no-fund
      - name: Local tests (offline, no emulator)
        run: npm test
      - name: Rules tests on the Firestore emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-journal "node --test tests/rules/*.rules.js"
